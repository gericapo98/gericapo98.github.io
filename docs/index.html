<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>PhosphorOS</title><style>:root{--phosphor:#3f3;--phosphor-bright:color-mix(in srgb, var(--phosphor) 60%, white);--phosphor-dim:color-mix(in srgb, var(--phosphor) 55%, transparent);--phosphor-faint:color-mix(in srgb, var(--phosphor) 20%, transparent)}:root[data-theme=amber]{--phosphor:#ffb000}:root[data-theme=ice]{--phosphor:#9fd8ff}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:#101010;overflow:hidden}::selection{background:var(--phosphor);color:#000}#screen{background:radial-gradient(ellipse at center, color-mix(in srgb, var(--phosphor) 5%, #050505) 0%, #050505 70%);color:var(--phosphor);transform-origin:50%;font-family:ui-monospace,SF Mono,Menlo,Consolas,Liberation Mono,monospace;font-size:clamp(13px,1.9vmin,18px);line-height:1.4;position:fixed;inset:0;overflow:hidden}#screen.fx-curve{border:1px solid var(--phosphor-faint);border-radius:2vmin;inset:1.5vmin;box-shadow:inset 0 0 12vmin #000000e6}#term{overscroll-behavior:contain;scrollbar-width:none;padding:clamp(14px,5vmin,64px);position:absolute;inset:0;overflow-y:auto}#term::-webkit-scrollbar{display:none}.line,#live{white-space:pre-wrap;overflow-wrap:break-word;min-height:1.4em}.bright{color:var(--phosphor-bright)}.dim{color:var(--phosphor-dim)}.fx-glow #output{text-shadow:0 0 3px var(--phosphor), 0 0 14px color-mix(in srgb, var(--phosphor) 26%, transparent)}.fx-aberration #output{text-shadow:1px 0 #ff005066,-1px 0 #008cff66}.fx-glow.fx-aberration #output{text-shadow:0 0 3px var(--phosphor), 0 0 14px color-mix(in srgb, var(--phosphor) 26%, transparent), 1px 0 #ff005066, -1px 0 #008cff66}.cursor{background:var(--phosphor);vertical-align:-.2em;width:.62em;height:1.15em;display:inline-block}.fx-glow .cursor{box-shadow:0 0 3px var(--phosphor), 0 0 14px color-mix(in srgb, var(--phosphor) 26%, transparent)}.overlay{pointer-events:none;display:none;position:absolute;inset:0}.fx-scanlines #fx-scanlines-overlay{mix-blend-mode:multiply;background:repeating-linear-gradient(#00000047 0 1px,#0000 1px 3px);display:block}.fx-vignette #fx-vignette-overlay{background:radial-gradient(#0000 55%,#0000008c 100%);display:block}.fx-rollbar #fx-rollbar-overlay{background:linear-gradient(#0000,#ffffff0a,#0000) 0/100% 30% no-repeat;display:block}#kbd{opacity:0;color:#0000;background:0 0;border:0;outline:none;width:1px;height:1px;position:absolute;bottom:0;left:0;overflow:hidden}@media (prefers-reduced-motion:no-preference){.cursor{animation:1.06s step-end infinite blink}#screen.fx-flicker{animation:6.4s linear infinite flicker}.fx-rollbar #fx-rollbar-overlay{animation:9s linear infinite rollbar}#screen.power-off{animation:.5s cubic-bezier(.55,0,.9,1) forwards power-off}#screen.power-on{animation:.35s cubic-bezier(.1,0,.45,1) forwards power-on}}@keyframes blink{0%,to{opacity:1}50%{opacity:0}}@keyframes flicker{0%,to{opacity:1}7%{opacity:.96}13%{opacity:1}22%{opacity:.94}29%{opacity:1}52%{opacity:.97}61%{opacity:1}80%{opacity:.95}87%{opacity:1}}@keyframes rollbar{0%{background-position:0 -50%}to{background-position:0 150%}}@keyframes power-off{0%{filter:brightness();transform:scale(1)}60%{filter:brightness(2.4);transform:scaleY(.012)}to{filter:brightness(6);transform:scale(.001,.012)}}@keyframes power-on{0%{filter:brightness(6);transform:scale(.001,.012)}45%{filter:brightness(2.4);transform:scaleY(.012)}to{filter:brightness();transform:scale(1)}}
</style></head><body><main id="screen" class="fx-glow fx-scanlines fx-vignette fx-curve fx-flicker fx-rollbar fx-aberration"><div id="term"><div id="output"><div id="scrollback"></div><div id="live" hidden><span class="prompt">guest@phosphor:~$ </span><span id="live-before"></span><span class="cursor" aria-hidden="true"></span><span id="live-after"></span></div></div></div><div id="fx-scanlines-overlay" class="overlay" aria-hidden="true"></div><div id="fx-vignette-overlay" class="overlay" aria-hidden="true"></div><div id="fx-rollbar-overlay" class="overlay" aria-hidden="true"></div><input id="kbd" type="text" aria-label="Terminal input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></main><script type="module" src="/_astro/index.astro_astro_type_script_index_0_lang.BqX4_3sE.js"></script></body></html>
